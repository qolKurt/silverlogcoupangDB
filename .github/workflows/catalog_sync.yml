name: Large Mart Catalog Sync

on:
  repository_dispatch:
    types: [trigger-sync]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: large-mart-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      SILVERLOG_ADMIN_URL: https://silverlog-admin.vercel.app
      SILVERLOG_ADMIN_USERNAME: ${{ secrets.SILVERLOG_ADMIN_USERNAME }}
      SILVERLOG_ADMIN_PASSWORD: ${{ secrets.SILVERLOG_ADMIN_PASSWORD }}
      DRY_RUN: ${{ github.event.client_payload.dry_run || 'false' }}
      RETAILER_FILTER: ${{ github.event.client_payload.retailer || '' }}
      ITEM_LIMIT: ${{ github.event.client_payload.item_limit || '0' }}
      SELENIUM_HEADLESS: "false"
      REQUEST_DELAY_MIN: "6"
      REQUEST_DELAY_MAX: "12"

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installed Chrome
        shell: pwsh
        run: |
          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chromePath = $chromePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $chromePath) { throw "Google Chrome이 설치되어 있지 않습니다." }
          "CHROME_BINARY=$chromePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $chromePath --version

      - name: Validate secrets
        shell: pwsh
        run: |
          if (-not $env:SILVERLOG_ADMIN_PASSWORD) {
            throw "SILVERLOG_ADMIN_PASSWORD repository secret is required."
          }

      - name: Run sync script
        run: python cat_sync_final.py

      - name: Publish job summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath sync_report.md) {
            Get-Content -Raw sync_report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload sync reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-sync-report
          path: |
            manual_check_report.txt
            sync_report.json
            sync_report.md
          if-no-files-found: ignore
